<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>City Care Hospital - Patients</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav>
    <span class="logo">City Care Hospital</span>
    <a href="index.html">Dashboard</a>
    <a href="patients.html" class="active">Patients</a>
    <a href="appointments.html">Appointments</a>
  </nav>

  <div class="container">
    <h1>Patients</h1>
    <p class="subtitle">Register a new patient and see the existing list.</p>

    <div class="card">
      <h2>Register patient</h2>
      <form>
        <label for="name">Full name</label>
        <input type="text" id="name" placeholder="e.g. Ravi Kumar" required>

        <label for="age">Age</label>
        <input type="number" id="age" min="0" max="120" required>

        <label for="gender">Gender</label>
        <select id="gender">
          <option>Male</option>
          <option>Female</option>
          <option>Other</option>
        </select>

        <label for="phone">Phone number</label>
        <input type="tel" id="phone" placeholder="10-digit number">

        <label for="problem">Problem / symptoms</label>
        <textarea id="problem" rows="3"></textarea>

        <button type="submit">Save patient</button>
      </form>
    </div>

    <div class="card">
      <h2>Patient list</h2>
      <br>
      <div class="table-wrap">
        <table>
          <tr><th>ID</th><th>Name</th><th>Age</th><th>Problem</th><th>Status</th></tr>
          <tr><td>P101</td><td>Ravi Kumar</td><td>34</td><td>Chest pain</td><td><span class="badge wait">Under observation</span></td></tr>
          <tr><td>P102</td><td>Anita Desai</td><td>52</td><td>Knee pain</td><td><span class="badge ok">Discharged</span></td></tr>
          <tr><td>P103</td><td>Sameer Khan</td><td>27</td><td>Fever</td><td><span class="badge wait">Admitted</span></td></tr>
        </table>
      </div>
    </div>
  </div>

</body>
</html>
